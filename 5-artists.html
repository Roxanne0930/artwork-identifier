        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            // 加载默认画家（齐白石）
            loadArtist('qi-bai-shi');
            
            // 添加侧边栏点击事件
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', () => {
                    // 移除所有激活状态
                    document.querySelectorAll('.sidebar-item').forEach(i => {
                        i.classList.remove('active');
                    });
                    
                    // 添加当前激活状态
                    item.classList.add('active');
                    
                    // 加载对应画家
                    const artistId = item.getAttribute('data-artist');
                    loadArtist(artistId);
                });
            });
            
            // 添加搜索功能
            const searchInput = document.getElementById('wikipedia-search');
            const searchBtn = document.getElementById('search-btn');
            
            // 搜索按钮点击事件
            searchBtn.addEventListener('click', () => {
                performSearch();
            });
            
            // 输入框回车事件
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        });

        // 加载画家详情
        function loadArtist(artistId) {
            const artist = artists[artistId];
            if (!artist) return;
            
            // 创建画家详情HTML
            const detailHtml = `
                <div class="relative h-64 md:h-80">
                    <img src="${artist.background}" alt="${artist.name}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex items-end">
                        <div class="p-6 md:p-8 text-white">
                            <h3 class="text-2xl md:text-3xl font-bold">${artist.name}</h3>
                            <p class="text-sm md:text-base text-gray-200">${artist.birthDate} - ${artist.deathDate}</p>
                        </div>
                    </div>
                </div>
                
                <div class="p-6 md:p-8">
                    <div class="flex flex-col md:flex-row gap-6 mb-8">
                        <div class="md:w-1/3">
                            <img src="${artist.portrait}" alt="${artist.name}画像" class="w-full h-auto rounded-lg shadow-md">
                        </div>
                        <div class="md:w-2/3">
                            <h4 class="text-xl font-semibold mb-4">简介</h4>
                            <p class="text-gray-700 mb-4">
                                ${artist.description}
                            </p>
                            <div class="flex flex-wrap gap-2 mt-4">
                                <a href="${artist.links.wikiart}" target="_blank" class="text-primary text-sm flex items-center btn-hover">
                                    <i class="fa-brands fa-wikipedia-w mr-1"></i> WikiArt
                                </a>
                                <a href="${artist.links.zhenbaoguan}" target="_blank" class="text-primary text-sm flex items-center btn-hover">
                                    <i class="fa-solid fa-book-open mr-1"></i> 中华珍宝馆
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <h4 class="text-xl font-semibold mb-6">代表作品</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${artist.works.map(work => `
                            <div class="bg-white rounded-lg shadow-md overflow-hidden card-hover">
                                <img src="${work.image}" alt="${work.name}" class="w-full h-48 object-cover">
                                <div class="p-4">
                                    <h5 class="font-medium">${work.name}</h5>
                                    <p class="text-sm text-gray-500">${work.type}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            // 更新页面内容
            document.getElementById('artist-detail').innerHTML = detailHtml;
            
            // 添加动画效果
            const detailElement = document.getElementById('artist-detail');
            detailElement.style.opacity = '0';
            detailElement.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                detailElement.style.opacity = '1';
                detailElement.style.transform = 'translateY(0)';
                detailElement.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            }, 50);
        }
        
        // 执行搜索功能（跳转至百度百科）
        function performSearch() {
            const searchInput = document.getElementById('wikipedia-search');
            const searchTerm = searchInput.value.trim();
            
            if (searchTerm) {
                // 编码搜索词并跳转到百度百科
                const encodedTerm = encodeURIComponent(searchTerm);
                window.open(`https://baike.baidu.com/item/${encodedTerm}`, '_blank');
            }
        }
    </script>
